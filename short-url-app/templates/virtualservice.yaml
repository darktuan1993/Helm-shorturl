apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: short-url-gateway
spec:
  selector:
    istio: ingressgateway # use istio default controller
  servers:
  - port:
      number: 8080
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: short-url
spec:
  hosts:
  - "m-alertmanager.bravo.com.vn"
  gateways:
  - short-url-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: {{ .Values.service.name}}
        port:
          number: 3000